<!-- login.html -->
{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width: 400px; margin: 50px auto;">
  <h2>Login</h2>
  <form method="POST" style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
    <input type="text" name="username" placeholder="Username" required style="padding:10px; border-radius:5px; border:1px solid #00f0ff; background:transparent; color:white;">
    <input type="password" name="password" placeholder="Password" required style="padding:10px; border-radius:5px; border:1px solid #00f0ff; background:transparent; color:white;">
    <button type="submit">Login</button>
  </form>
</div>
{% endblock %}
