{% extends "base.html" %}

{% block content %}
<section class="panel">
  <h2>Fire Activity Dashboard</h2>
  <p>Data loaded from the SQLite Database.</p>
  <div id="map"></div>
</section>

<section class="metrics">
  <article class="metric panel"><span>Detections in area</span><strong id="totalCount">0</strong></article>
  <article class="metric panel"><span>MODIS</span><strong id="modisCount">0</strong></article>
  <article class="metric panel"><span>VIIRS</span><strong id="viirsCount">0</strong></article>
</section>

<section class="panel">
  <h2>Detections by Month</h2>
  <div class="chart-wrapper">
    <canvas id="monthlyChart"></canvas>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
