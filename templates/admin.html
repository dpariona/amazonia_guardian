{% extends "base.html" %}

{% block content %}
<section class="panel">
  <div class="section-head">
    <h2>Admin CRUD - Manage Detections</h2>
  </div>

  <!-- Contenedor de los dos formularios -->
  <div style="display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap;">
    
    <!-- Formulario Manual -->
    <div style="flex: 1; min-width: 300px; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
      <h3 style="color: var(--accent-cyan); margin-bottom: 15px;">Agregar Detección Manual</h3>
      <form id="addForm" style="display:flex; flex-direction: column; gap:10px;">
        <input type="number" step="0.0001" id="lat" placeholder="Latitud" required style="padding: 10px; border-radius: 8px; background: transparent; border: 1px solid var(--border-glow); color: white;">
        <input type="number" step="0.0001" id="lon" placeholder="Longitud" required style="padding: 10px; border-radius: 8px; background: transparent; border: 1px solid var(--border-glow); color: white;">
        <select id="sensor" style="padding: 10px; border-radius: 8px; background: var(--bg-deep); border: 1px solid var(--border-glow); color: white;">
            <option>MODIS</option>
            <option>VIIRS</option>
        </select>
        <input type="date" id="date" required style="padding: 10px; border-radius: 8px; background: transparent; border: 1px solid var(--border-glow); color: white;">
        <button type="submit" class="nav-btn" style="margin-top: 10px;">Agregar Registro</button>
      </form>
    </div>

    <!-- Formulario CSV -->
    <div style="flex: 1; min-width: 300px; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
      <h3 style="color: var(--accent-green); margin-bottom: 15px;">Importar CSV de la NASA (FIRMS)</h3>
      <p class="muted" style="margin-bottom: 15px; font-size: 0.85rem;">Sube el archivo descargado de FIRMS para poblar la base de datos automáticamente.</p>
      <form action="/upload_csv" method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px;">
        <input type="file" name="file" accept=".csv" required style="padding: 10px; border-radius: 8px; border: 1px dashed var(--accent-green); color: var(--text-muted); background: rgba(57, 255, 20, 0.05);">
        <button type="submit" class="nav-btn" style="background: var(--accent-green);">Subir e Importar</button>
      </form>
    </div>

  </div>

  <!-- Tabla de Datos -->
  <h3 style="color: white; margin-bottom: 15px;">Registros en la Base de Datos</h3>
  <table style="width:100%; text-align:left; border-collapse:collapse;" id="adminTable">
    <thead>
        <tr style="border-bottom:1px solid var(--accent-cyan);">
            <th>ID</th><th>Lat</th><th>Lon</th><th>Sensor</th><th>Date</th><th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
async function loadTable() {
  const res = await fetch('/api/detections');
  const data = await res.json();
  const tbody = document.querySelector('#adminTable tbody');
  tbody.innerHTML = '';
  data.forEach(d => {
    tbody.innerHTML += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
      <td>${d.id}</td><td>${d.latitude}</td><td>${d.longitude}</td><td>${d.sensor}</td><td>${d.acq_date}</td>
      <td><button class="delete-btn" onclick="deleteDet(${d.id})">Delete</button></td>
    </tr>`;
  });
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  await fetch('/api/detections', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      latitude: parseFloat(document.getElementById('lat').value),
      longitude: parseFloat(document.getElementById('lon').value),
      sensor: document.getElementById('sensor').value,
      acq_date: document.getElementById('date').value,
      confidence: 'high'
    })
  });
  document.getElementById('addForm').reset();
  loadTable();
});

async function deleteDet(id) {
  await fetch(`/api/detections/${id}`, {method: 'DELETE'});
  loadTable();
}
loadTable();
</script>
{% endblock %}
